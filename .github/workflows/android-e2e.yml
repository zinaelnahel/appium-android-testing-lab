name: Android E2E

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Build demo app
        run: gradle --no-daemon assembleDebug

      - name: Install Python test dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Appium and UiAutomator2
        run: |
          npm install --global appium
          appium driver install uiautomator2

      - name: Run tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p artifacts
            appium --log artifacts/appium.log > artifacts/appium-console.log 2>&1 &
            for attempt in $(seq 1 60); do
              if curl --silent --fail http://127.0.0.1:4723/status > /dev/null; then
                break
              fi
              sleep 1
            done
            set +e
            pytest -q --junitxml=artifacts/junit.xml
            test_status=$?
            adb logcat -d > artifacts/logcat.txt
            exit "$test_status"

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-evidence
          path: artifacts/
          if-no-files-found: ignore
